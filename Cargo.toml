[package]
name = "who-icd11-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Vivek Gupta <drguptavivek>"]
repository = "https://github.com/drguptavivek/who-icd11-api"
description = "In-process host and offline server for the WHO ICD-11 API 2.6.0, DORIS 1.2.0 and CoDEdit; fetches WHO's files itself, redistributes none"
readme = "README.md"
homepage = "https://github.com/drguptavivek/who-icd11-api"
keywords = ["icd-11", "who", "mortality", "death-certificate", "doris"]
categories = ["api-bindings", "command-line-utilities", "science"]
include = [
    "/src/**",
    "/bridge/Bridge.cs",
    "/bridge/DigitvaIcd11Bridge.csproj",
    "/bridge/DigitvaIcd11Bridge.dll",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[lib]
name = "who_icd11_api"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "who-icd11-server"
path = "src/bin/who_icd11_server.rs"

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
libloading = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
