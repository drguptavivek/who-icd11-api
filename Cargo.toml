[package]
name = "who-icd11-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Vivek Gupta <drguptavivek>"]
repository = "https://github.com/drguptavivek/who-icd11-api"
description = "Native Rust in-process DLL host, pure-Rust OCI/CDN bootstrapper, and zero-Docker server for WHO ICD-11 API 2.6.0 & DORIS 1.2.0"

[lib]
name = "who_icd11_api"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "who-icd11-server"
path = "src/bin/who_icd11_server.rs"

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
libloading = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
