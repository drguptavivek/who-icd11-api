name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Offline job: no bundle, no network beyond crates.io.
  # test_live_in_process_who_icd11_and_doris_dll_engine and
  # test_sha256_pinned_bundle_integrity_and_tamper_detection call Icd11Engine::global(),
  # which bootstraps WHO's files over the network when no bundle exists, so they are
  # skipped here and run in `integration`.
  # `cargo fmt --check` is not run: the code base is not rustfmt-clean yet.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add clippy
      - run: cargo build --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --skip test_live_in_process --skip test_sha256_pinned

  # Downloads WHO's assemblies and data (pinned SHA-256) and runs the whole suite,
  # including the six WHO DORIS & CoDEdit reference certificates.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Locate .NET root
        run: echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime
          key: who-runtime-${{ hashFiles('src/bootstrap.rs') }}
      - name: Bootstrap (no-op for files already cached; every file is re-verified)
        run: cargo run --release --locked --bin who-icd11-server -- --bootstrap --output-dir runtime
      - name: Full integration suite
        env:
          DIGITVA_ICD11_BUNDLE_DIR: ${{ github.workspace }}/runtime/icdapi
          DIGITVA_ICD11_DATA_DIR: ${{ github.workspace }}/runtime/data
        run: cargo test --release --locked
