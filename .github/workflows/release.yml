name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the draft release (empty: build and guard only, no release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          # x86_64-pc-windows-msvc is intentionally absent: src/hostfxr.rs passes UTF-8
          # char* to hostfxr, which takes wchar_t* (UTF-16) on Windows. See README.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --bin who-icd11-server --target ${{ matrix.target }}
      - name: Smoke test (binary starts, no .NET needed for --help)
        run: ./target/${{ matrix.target }}/release/who-icd11-server --help
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          name="who-icd11-server-${REF_NAME//\//-}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/who-icd11-server" LICENSE NOTICE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r "dist/${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  guard-and-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release; the only job that can write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Guard - archives must hold only our files, never WHO artefacts
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz)
          [ "${#archives[@]}" -eq 4 ] || { echo "expected 4 archives, found ${#archives[@]}"; exit 1; }
          for a in "${archives[@]}"; do
            echo "== $a"
            tar -tzf "$a" > listing.txt
            cat listing.txt
            if grep -Eiq '\.dll$|\.pbf(\.gz|\.zip)?$|\.zip$|rules\.json$|DORIS|icdapi' listing.txt; then
              echo "::error::$a contains a WHO artefact"; exit 1
            fi
            # Allowlist: the directory, the binary, LICENSE, NOTICE, README.md - nothing else.
            if grep -Ev '^[^/]+/$|^[^/]+/(who-icd11-server|LICENSE|NOTICE|README\.md)$' listing.txt; then
              echo "::error::$a contains unexpected files"; exit 1
            fi
          done
          rm listing.txt
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz | tee SHA256SUMS
      - name: Draft release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || { echo "bad tag: $TAG"; exit 1; }
          cat > notes.md <<'EOF'
          Binaries only. These archives contain no WHO assemblies and no WHO data.
          After installing the .NET 10 runtime, run `who-icd11-server --bootstrap --output-dir runtime`
          to download them from WHO's own sources (pinned SHA-256). See README.md and NOTICE.
          Windows is not supported yet. Verify downloads against SHA256SUMS.
          EOF
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --draft --title "$TAG" --notes-file notes.md
